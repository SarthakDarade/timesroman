  <body>
    <div id="root">
      <!-- Enhanced initial loading state to minimize CLS -->
      <div class="critical-loading fade-in" id="initial-loader">
        <div style="text-align: center;">
          <img 
            src="https://i.ibb.co/Z6ffRH7K/Timesromancir-logo.png" 
            alt="Times Roman Logo" 
            width="200" 
            height="50"
            style="margin-bottom: 20px;"
          />
          <div class="loading-spinner" style="margin: 0 auto 16px;"></div>
          <p style="color: #6b7280; margin: 0; font-size: 14px;">Loading the latest news...</p>
          <p style="color: #9ca3af; margin: 8px 0 0; font-size: 12px;">Powered by AI • Trusted by readers</p>
        </div>
      </div>
    </div>
    
    <!-- Hide initial loader when React app loads -->
    <script>
      window.addEventListener('DOMContentLoaded', function() {
        // Hide loader after a maximum of 3 seconds even if React hasn't loaded
        setTimeout(function() {
          const loader = document.getElementById('initial-loader');
          if (loader) {
            loader.style.opacity = '0';
            loader.style.transition = 'opacity 0.5s ease-out';
            setTimeout(function() {
              if (loader.parentNode) {
                loader.parentNode.removeChild(loader);
              }
            }, 500);
          }
        }, 3000);
      });
      
      // Hide loader when React takes over
      window.addEventListener('load', function() {
        setTimeout(function() {
          const loader = document.getElementById('initial-loader');
          if (loader) {
            loader.style.opacity = '0';
            loader.style.transition = 'opacity 0.3s ease-out';
            setTimeout(function() {
              if (loader.parentNode) {
                loader.parentNode.removeChild(loader);
              }
            }, 300);
          }
        }, 100);
      });
    </script>
